name: Verify published npm provenance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published TypedMailer version or v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the current npm CLI for provenance verification
        run: npm install --global npm@latest
      - name: Verify the published package provenance
        run: node scripts/verify-published-provenance.mjs
        env:
          PUBLISHED_VERSION: ${{ inputs.version }}
