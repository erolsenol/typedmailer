name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install provider SDKs and development tools
        run: npm ci
      - name: Run tests, type checks, examples, build, and packed consumer checks
        run: npm run check

  provider-peer-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install minimum supported provider SDK versions
        run: >-
          npm install --no-save --ignore-scripts --no-audit --no-fund
          @aws-sdk/client-sesv2@3.0.0
          @getbrevo/brevo@6.0.1
          @sendgrid/mail@8.0.0
          form-data@4.0.0
          mailgun.js@14.0.0
          nodemailer@7.0.0
          postmark@5.0.0
          resend@6.0.0
      - name: Verify minimum SDK compatibility
        run: npm run typecheck && npm test && npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm run security:audit
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
