name: Published npm consumer

on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * 3'

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - id: check
        run: node scripts/check-published-package.mjs

  consumer:
    needs: availability
    if: needs.availability.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install published package in a clean consumer
        run: node scripts/package-smoke.mjs
        env:
          TYPEDMAILER_PACKAGE_SPEC: typedmailer@latest
