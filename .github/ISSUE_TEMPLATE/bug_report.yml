name: Bug report
description: Report a reproducible TypedMailer issue
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Share only sanitized diagnostics. Never include API keys, SMTP credentials, recipient addresses, message content, or unreviewed provider error causes.
  - type: input
    id: typedmailer-version
    attributes:
      label: TypedMailer version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.14.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Resend
        - Brevo
        - Postmark
        - SendGrid
        - Mailgun
        - Amazon SES
        - SMTP
        - Test adapter
    validations:
      required: true
  - type: input
    id: provider-sdk-version
    attributes:
      label: Provider SDK and version
      description: Include the package name and version; write "N/A" for SMTP infrastructure details only.
      placeholder: resend 6.0.0
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation that failed
      options:
        - Configuration
        - send()
        - verifyConnection()
        - close()
        - TypeScript/build
    validations:
      required: true
  - type: textarea
    id: safe-error
    attributes:
      label: Sanitized MailError details
      description: 'Safe fields only: code, provider, retryable, deliveryUnknown. Do not paste cause or raw SDK response.'
      placeholder: 'code=provider, provider=resend, retryable=true, deliveryUnknown=false'
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove all secrets and real personal data.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
