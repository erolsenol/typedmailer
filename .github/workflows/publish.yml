name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the current npm CLI for provenance verification
        run: npm install --global npm@latest
      - name: Verify release tag, package version, and changelog
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm run check
      - run: npm run security:audit
      - run: npm publish --provenance
      - name: Verify npm provenance for the published version
        run: node scripts/verify-published-provenance.mjs
        env:
          PUBLISHED_VERSION: ${{ github.event.release.tag_name }}
