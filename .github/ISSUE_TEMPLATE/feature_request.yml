name: Feature request
description: Suggest a provider capability or API improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the user impact. Avoid credentials, real recipient details, or message content.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain the workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like TypedMailer to do?
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Related provider
      multiple: true
      options:
        - Resend
        - Brevo
        - Postmark
        - SendGrid
        - Mailgun
        - Amazon SES
        - SMTP
        - Provider independent
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and impact
      description: Include workarounds, adoption impact, and relevant SDK or Node versions.
    validations:
      required: false
